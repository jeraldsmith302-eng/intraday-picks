name: Daily intraday scan
on:
  schedule:
    - cron: "15 3 * * 1-5"   # 8:45 AM IST, Mon-Fri
  workflow_dispatch:         # lets you run it by hand
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - run: python india_intraday_agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "picks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html picks_*.csv
          git commit -m "Picks $(date -u +%F)" || exit 0
          git push
